name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1" # Monday 9:23 UTC

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    if: github.repository == 'hao1939/herdr-supervisor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: herdr-supervisor:e2e

      - name: Start Herdr with supervisor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY and OPENAI_API_KEY secrets are required"
            exit 1
          fi

          docker run -d --name herdr-e2e \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e HERDR_SUPERVISOR_MODE=live \
            -e HERDR_SUPERVISOR_CODEX_FULL_ACCESS=1 \
            herdr-supervisor:e2e \
            herdr server

          sleep 3
          docker exec herdr-e2e herdr status

      - name: Start Pi supervisor
        run: |
          # Start Pi with the supervisor extension in a Herdr pane
          docker exec herdr-e2e \
            herdr agent start supervisor --kind pi --pane w0:p0 -- \
              --no-builtin-tools \
              --supervisor-mode live

          # Wait for Pi to become interactive
          docker exec herdr-e2e \
            herdr agent wait w0:p0 --until idle --timeout 30000

          echo "Pi supervisor is running"

      - name: Verify supervisor tools registered
        run: |
          # Ask the supervisor to show its status — this exercises the
          # extension's session_start handler and supervisor_status tool
          docker exec herdr-e2e \
            herdr agent prompt w0:p0 "Use supervisor_status to show current supervised workers."

          # Wait for the supervisor to finish its turn
          docker exec herdr-e2e \
            herdr agent wait w0:p0 --until idle --timeout 60000

          # Read the response — should mention "No supervised workers"
          output=$(docker exec herdr-e2e herdr agent read w0:p0 --lines 20 2>&1)
          echo "$output"

          if echo "$output" | grep -qi "supervised\|No supervised\|supervising 0"; then
            echo "Supervisor tools are registered and responding"
          else
            echo "::warning::Could not confirm supervisor tool response"
          fi

      - name: Create a test goal
        run: |
          # Ask the supervisor to create a trivial goal
          docker exec herdr-e2e \
            herdr agent prompt w0:p0 \
              "Create a supervised goal: objective is 'Write hello.txt containing hello world', acceptance is 'hello.txt exists with the text hello world', working directory is /app, place it in a new tab labeled test-worker."

          # Wait for the supervisor to process and start the worker
          docker exec herdr-e2e \
            herdr agent wait w0:p0 --until idle --timeout 120000

          # Verify a worker was created
          workers=$(docker exec herdr-e2e herdr agent list 2>&1)
          echo "$workers"

          if echo "$workers" | grep -q "codex"; then
            echo "Codex worker started successfully"
          else
            echo "::error::No Codex worker was created"
            exit 1
          fi

      - name: Wait for worker progress
        run: |
          # Give the worker up to 2 minutes to make progress
          for i in $(seq 1 12); do
            sleep 10
            status=$(docker exec herdr-e2e herdr agent list 2>&1)
            echo "Check $i: $status"

            # If the worker has settled (idle/blocked/done), check the file
            if docker exec herdr-e2e test -f /app/hello.txt 2>/dev/null; then
              echo "Worker created hello.txt"
              docker exec herdr-e2e cat /app/hello.txt
              break
            fi
          done

      - name: Verify goal state
        run: |
          # Check supervisor goal state
          docker exec herdr-e2e \
            herdr agent prompt w0:p0 "Use supervisor_status to show all supervised workers."

          docker exec herdr-e2e \
            herdr agent wait w0:p0 --until idle --timeout 60000

          docker exec herdr-e2e herdr agent read w0:p0 --lines 30

          echo "E2E test completed"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Herdr status ==="
          docker exec herdr-e2e herdr status 2>&1 || true
          echo "=== Agent list ==="
          docker exec herdr-e2e herdr agent list 2>&1 || true
          echo "=== Supervisor output ==="
          docker exec herdr-e2e herdr agent read w0:p0 --lines 50 2>&1 || true
          echo "=== Container logs ==="
          docker logs herdr-e2e 2>&1 | tail -50 || true

      - name: Cleanup
        if: always()
        run: docker rm -f herdr-e2e 2>/dev/null || true
