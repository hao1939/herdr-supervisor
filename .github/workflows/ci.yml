name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        node-version: ["26"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck container/container-entrypoint.sh container/bin/codex container/bin/pi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: herdr-supervisor:ci
      - name: Smoke test container
        run: |
          # Verify the entrypoint installs the extension symlink
          docker run --rm herdr-supervisor:ci \
            test -L /home/node/.pi/agent/extensions/herdr-supervisor.ts

          # Verify the symlink target exists and re-exports the extension
          docker run --rm herdr-supervisor:ci \
            grep -q 'extension.ts' /home/node/.pi/agent/extensions/herdr-supervisor.ts

          # Verify all source modules were copied
          docker run --rm herdr-supervisor:ci \
            sh -c 'for f in extension goal-store goal-registry herdr-client observation review-turn supervision global-review; do test -f /opt/herdr-supervisor/src/$f.ts || exit 1; done'

          # Verify the Pi and Codex shims are executable
          docker run --rm herdr-supervisor:ci \
            sh -c 'test -x /usr/local/bin/pi && test -x /usr/local/bin/codex'

          # Verify Herdr binary is present and executable
          docker run --rm herdr-supervisor:ci \
            herdr --version

      - name: Integration test
        run: |
          # Start Herdr server in the background
          docker run -d --name herdr-integration herdr-supervisor:ci \
            herdr server
          sleep 3

          # Verify Herdr server is running and the socket is live
          docker exec herdr-integration \
            herdr status

          # Verify goal storage is initialized and accessible
          docker exec herdr-integration \
            node --experimental-strip-types -e "
              import { loadSupervisorGoals } from '/opt/herdr-supervisor/src/goal-registry.ts';
              const goals = await loadSupervisorGoals();
              if (!Array.isArray(goals.active)) process.exit(1);
              console.log('goal store: ok');
            "

          docker stop herdr-integration
          docker rm herdr-integration
