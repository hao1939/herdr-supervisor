name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck container/container-entrypoint.sh container/bin/codex container/bin/pi
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: herdr-supervisor:ci
          cache-from: type=gha,scope=herdr-supervisor-ci
          cache-to: type=gha,mode=max,scope=herdr-supervisor-ci
      - name: Smoke test container
        run: |
          # Ordinary Pi sessions must not auto-load the supervisor
          docker run --rm herdr-supervisor:ci \
            sh -c 'test ! -e /home/node/.pi/agent/extensions/herdr-supervisor.ts && test ! -L /home/node/.pi/agent/extensions/herdr-supervisor.ts'

          # Exercise the packaged Pi loader, with and without explicit activation
          docker run --rm herdr-supervisor:ci \
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { DefaultResourceLoader, SettingsManager } from "/opt/herdr-supervisor/node_modules/@earendil-works/pi-coding-agent/dist/index.js";
              for (const explicit of [false, true]) {
                const loader = new DefaultResourceLoader({
                  cwd: "/app",
                  agentDir: "/home/node/.pi/agent",
                  settingsManager: SettingsManager.inMemory(),
                  additionalExtensionPaths: explicit ? ["/opt/herdr-supervisor/container/supervisor-extension.ts"] : [],
                });
                await loader.reload();
                const result = loader.getExtensions();
                assert.deepEqual(result.errors, []);
                assert.equal(result.extensions.length, explicit ? 1 : 0);
                if (explicit) assert.ok(result.extensions[0].tools.has("supervisor_start_goal"));
              }
            '

          # The old auto-load entry point must never activate supervision
          docker run --rm herdr-supervisor:ci \
            node --input-type=module -e '
              import legacy from "/opt/herdr-supervisor/container/pi-extension.ts";
              try { legacy(); } catch (error) {
                if (error.message.includes("auto-loading was removed")) process.exit(0);
                throw error;
              }
              process.exit(1);
            '

          # Verify all source modules were copied
          docker run --rm herdr-supervisor:ci \
            sh -c 'for f in extension goal-store goal-registry herdr-client observation review-turn supervision global-review; do test -f /opt/herdr-supervisor/src/$f.ts || exit 1; done'

          # Verify the replacement metadata watcher is packaged
          docker run --rm herdr-supervisor:ci \
            test -f /opt/herdr-supervisor/src/event-watcher/daemon.mjs

          # Verify the packaged watcher can load its production dependencies
          docker run --rm herdr-supervisor:ci \
            node /opt/herdr-supervisor/src/event-watcher/daemon.mjs --help

          # Verify the Pi and Codex shims are executable
          docker run --rm herdr-supervisor:ci \
            sh -c 'test -x /usr/local/bin/pi && test -x /usr/local/bin/codex'

          # Verify Herdr binary is present and executable
          docker run --rm herdr-supervisor:ci \
            herdr --version

          # Interactive overrides keep stdin when the watcher is disabled
          printf 'hello\n' | docker run --rm -i herdr-supervisor:ci \
            sh -c 'IFS= read -r line && test "$line" = hello'

          # An enabled watcher is required: its startup failure stops the service
          set +e
          timeout 10 docker run --rm \
            -e HERDR_WATCH_GITHUB_REPOSITORIES=invalid \
            herdr-supervisor:ci sh -c 'sleep 30'
          watcher_status=$?
          set -e
          test "$watcher_status" -eq 1

      - name: Integration test
        run: |
          # Start Herdr server in the background
          docker run -d --name herdr-integration herdr-supervisor:ci \
            herdr server
          sleep 3

          # Verify Herdr server is running and the socket is live
          docker exec herdr-integration \
            herdr status

          # Verify goal storage is initialized and accessible
          docker exec herdr-integration \
            node --experimental-strip-types -e "
              import { loadSupervisorGoals } from '/opt/herdr-supervisor/src/goal-registry.ts';
              const goals = await loadSupervisorGoals();
              if (!Array.isArray(goals.active)) process.exit(1);
              console.log('goal store: ok');
            "

          docker stop herdr-integration
          docker rm herdr-integration
