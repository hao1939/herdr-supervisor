services:
  herdr:
    build:
      context: .
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    environment:
      ANTHROPIC_API_KEY:
      GEMINI_API_KEY:
      OPENAI_API_KEY:
      GITHUB_TOKEN:
      GH_TOKEN:
      AZURE_DEVOPS_EXT_PAT:
      AZURE_CLI:
      HERDR_SUPERVISOR_MODE: ${HERDR_SUPERVISOR_MODE:-off}
      HERDR_SUPERVISOR_CODEX_FULL_ACCESS: ${HERDR_SUPERVISOR_CODEX_FULL_ACCESS:-0}
      HERDR_SUPERVISOR_DIRECTORY: ${HERDR_SUPERVISOR_DIRECTORY:-/app}
      HERDR_SUPERVISOR_REVIEW_MS: ${HERDR_SUPERVISOR_REVIEW_MS:-3600000}
      HERDR_SUPERVISOR_GLOBAL_REVIEW_MS: ${HERDR_SUPERVISOR_GLOBAL_REVIEW_MS:-3600000}
      HERDR_WATCH_GITHUB_REPOSITORIES: ${HERDR_WATCH_GITHUB_REPOSITORIES:-}
      HERDR_WATCH_ADO_DEFINITIONS: ${HERDR_WATCH_ADO_DEFINITIONS:-}
      HERDR_WATCH_ADO_REPOSITORIES: ${HERDR_WATCH_ADO_REPOSITORIES:-}
      HERDR_WATCH_ADO_CREATOR_ID: ${HERDR_WATCH_ADO_CREATOR_ID:-}
      HERDR_WATCH_INTERVAL_MS: ${HERDR_WATCH_INTERVAL_MS:-60000}
      HERDR_WATCH_STALE_AFTER_MS: ${HERDR_WATCH_STALE_AFTER_MS:-86400000}
      HERDR_WATCH_STATE_HOME: ${HERDR_WATCH_STATE_HOME:-}
    volumes:
      - herdr-home:/home/node
      - ${HERDR_WORKSPACE:-herdr-workspace}:/app

volumes:
  herdr-home:
  herdr-workspace:
