services:
  herdr:
    build:
      context: .
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    environment:
      ANTHROPIC_API_KEY:
      GEMINI_API_KEY:
      OPENAI_API_KEY:
      GITHUB_TOKEN:
      GH_TOKEN:
      AZURE_DEVOPS_EXT_PAT:
      HERDR_SUPERVISOR_MODE: ${HERDR_SUPERVISOR_MODE:-live}
      HERDR_SUPERVISOR_CODEX_FULL_ACCESS: ${HERDR_SUPERVISOR_CODEX_FULL_ACCESS:-0}
      HERDR_SUPERVISOR_DIRECTORY: ${HERDR_SUPERVISOR_DIRECTORY:-/app}
      HERDR_SUPERVISOR_REVIEW_MS: ${HERDR_SUPERVISOR_REVIEW_MS:-3600000}
      HERDR_SUPERVISOR_GLOBAL_REVIEW_MS: ${HERDR_SUPERVISOR_GLOBAL_REVIEW_MS:-3600000}
      HERDR_SUPERVISOR_EXTERNAL_WATCH_MS: ${HERDR_SUPERVISOR_EXTERNAL_WATCH_MS:-300000}
    volumes:
      - herdr-home:/home/node
      - ${HERDR_WORKSPACE:-herdr-workspace}:/app

volumes:
  herdr-home:
  herdr-workspace:
